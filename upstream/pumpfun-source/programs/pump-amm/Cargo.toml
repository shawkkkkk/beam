[package]
name = "pump-amm-recovered"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pump_amm_recovered"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["event-cpi", "init-if-needed"] }

anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022", "associated_token", "token_2022_extensions", "metadata"] }

uint = { version = "=0.9.5", default-features = false }

native-transfer-fee = { path = "../../crates/native-transfer-fee" }

[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1

[workspace]

