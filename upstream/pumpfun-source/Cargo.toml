[workspace]
members = ["programs/pump-fees", "programs/pump-fees/pump-fees-math"]
exclude = ["programs/pump-fees/vendor/used-public"]
resolver = "2"

[profile.release]
panic = "abort"
overflow-checks = true
lto = false
codegen-units = 1

[patch.crates-io]
anchor-attribute-program = { path = "programs/pump-fees/vendor/used-public" }
