name: Native SOL ABI fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  golden-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sdk/beam-native.test.mjs sdk/no-pumpswap-surface.test.mjs
