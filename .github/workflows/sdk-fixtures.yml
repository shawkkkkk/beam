name: Local SDK and service tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  golden-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          shopt -s nullglob
          node --test sdk/*.test.mjs backend/*/*.test.mjs
