name: Contract fork checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/check_fork.py
      - run: cargo test --locked --manifest-path programs/beam/Cargo.toml
      - run: cargo test --locked --manifest-path programs/beam/Cargo.toml --features experimental-raydium
      - run: cargo check --locked --manifest-path programs/beam/Cargo.toml --no-default-features
